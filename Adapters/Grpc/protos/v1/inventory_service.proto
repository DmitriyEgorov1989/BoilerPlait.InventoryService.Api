syntax = "proto3";

option csharp_namespace = "BoilerPlait";

import "google/protobuf/timestamp.proto";

service InventoryServices
{
	rpc GetPart(GetPartByIdRequest) returns (GetPartByIdResponse);
	rpc GetListParts(GetListPartsRequest) returns (GetListPartsResponse);
}


//GetPart
message GetPartByIdRequest{
    string uuid = 1;
}

message GetPartByIdResponse{
	Part part = 1;
}

//GetListParts
message GetListPartsRequest{
	PartsFilter filter = 1;
}

message GetListPartsResponse{
	repeated Part parts = 1;
}

//Common
message PartsFilter{
	repeated string uuids = 1;
	repeated string names = 2;
	repeated Category categories = 3;
	repeated string manufacturer_countries = 4;
	repeated string tags = 5;
}

message Part{
	string uuid = 1;
	string name = 2;
	string description = 3;
	double price = 4;
	int64 stock_quantity = 5;
	Category category = 6;
	Dimensions dimensions = 7;
	Manufacturer manufacturer = 8;
	repeated string tags = 9;
	map<string,MetaValue> metadata = 10;
	google.protobuf.Timestamp created_at=11;
	google.protobuf.Timestamp updated_at=12;

}

message Dimensions{
	double length = 1;
	double width = 2;
	double height = 3;
	double weight = 4;
}

message Manufacturer{
	string name = 1;
	string country = 2;
	string website = 3;
}

//metadata
message MetaValue{
	oneof kind{
        string string_value = 1;
	    int64 int64_value = 2;
	    double double_value = 3;
	    bool bool_value = 4;
	}
}

enum Category{
	UNKNOWN = 0;
	ENGINE = 1;
	FUEL = 2;
	PORTHOLE = 3;
	WING = 4;
}
